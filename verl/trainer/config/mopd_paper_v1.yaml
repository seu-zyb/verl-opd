# Same optimization/data/evaluation budget as the OPD control.
defaults:
  - opd_paper_v1
  - _self_

distillation:
  full_rollout_context: true
  full_rollout_context_source: other
  # Problem + complete B (up to 16384 tokens) + instruction/template overhead.
  full_rollout_context_max_prompt_length: 20480
  # The companion is unverified; ask the teacher to solve independently.
  full_rollout_context_instruction: >-
    The solution above is another student's attempt at the same problem and has not been verified.
    It may be correct or incorrect. Consider it while solving the original problem independently.
    Follow the answer format required by the original problem.
  teacher_models:
    teacher_model:
      inference:
        # Prefix budget + unchanged A response cap + one dummy generation token.
        max_model_len: 36865

trainer:
  project_name: mopd_paper_v1
  experiment_name: qwen3_1.7b_base_from_14b_other_rollout_seed${data.seed}
  mopd_pairing_dir: ${trainer.default_local_dir}/mopd_pairing
